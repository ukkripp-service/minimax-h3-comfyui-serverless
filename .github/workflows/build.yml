name: build-minimax-h3-turbo-image
on:
  push:
    paths: ['Dockerfile', '.github/workflows/build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push code image (no weights)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:code
          provenance: false
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4
      # Baking 42.5GB of weights via docker build needs ~2x content size on disk
      # (build snapshots + exported blobs) and OOMs the runner disk. crane append
      # streams one tar layer at a time onto the remote image instead: peak disk
      # is a single weight file + its tar (< 45GB, lives on /mnt).
      - name: Append weight layers with crane
        env:
          IMG: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2
          crane auth login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          WORK=/mnt/weights
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          BASE="$IMG:code"
          append() { # $1 models subdir, $2 filename, $3 url
            mkdir -p "$WORK/stage/comfyui/models/$1"
            aria2c -x16 -s16 -k1M --console-log-level=warn \
              --dir="$WORK/stage/comfyui/models/$1" -o "$2" "$3"
            tar --owner=0 --group=0 -cf "$WORK/layer.tar" -C "$WORK/stage" comfyui
            rm -rf "$WORK/stage"
            crane append -b "$BASE" -f "$WORK/layer.tar" -t "$IMG:wip"
            rm -f "$WORK/layer.tar"
            BASE="$IMG:wip"
            df -h /mnt | tail -1
          }
          append diffusion_models minimax_h3_fl2va_pruned_int8_convrot.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
          append text_encoders qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
          append vae minimax_h3_video_vae_fp16.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors
          append vae minimax_h3_audio_vae_fp32.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors
          append loras minimax_h3_turbo_v4_step600_ema.safetensors \
            https://huggingface.co/larryvrh/MiniMax-H3-Turbo-Lora/resolve/43a74557ac3f6539db8e0f2a959d03feb7a81480/minimax_h3_turbo_v4_step600_ema.safetensors
          crane tag "$IMG:wip" latest
          IMMUTABLE_TAG="sha-${GITHUB_SHA::12}"
          crane tag "$IMG:wip" "$IMMUTABLE_TAG"
          echo "Built $IMG:$IMMUTABLE_TAG" >> "$GITHUB_STEP_SUMMARY"
